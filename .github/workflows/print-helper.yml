name: Manna Print Helper
on:
  pull_request:
    paths: ['desktop/print-helper/**', 'public/fonts/ibm-plex-sans/**', 'public/manna-receipt-logo.png', '.github/workflows/print-helper.yml']
  push:
    branches: [main]
    paths: ['desktop/print-helper/**', 'public/fonts/ibm-plex-sans/**', 'public/manna-receipt-logo.png', '.github/workflows/print-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fonts and Java application
        shell: pwsh
        run: |
          python -m pip install 'fonttools[woff]==4.61.1'
          python desktop/print-helper/build-resources.py
          mvn -B -f desktop/print-helper/pom.xml verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package native application with Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/print-helper/input | Out-Null
          Copy-Item desktop/print-helper/target/manna-print-helper.jar build/print-helper/input
          Copy-Item desktop/print-helper/target/lib build/print-helper/input -Recurse
          jpackage --type app-image --name MannaPrintHelper --app-version 1.0.1 --vendor 'Manna Print' --input build/print-helper/input --dest build/print-helper/package --main-jar manna-print-helper.jar --main-class id.manna.print.Main --java-options '-Xmx256m'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item desktop/print-helper/windows/* build/print-helper/package
          Compress-Archive -Path build/print-helper/package/* -DestinationPath build/print-helper/MannaPrintHelper-Windows-x64.zip
          $hash = (Get-FileHash build/print-helper/MannaPrintHelper-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MannaPrintHelper-Windows-x64.zip" | Set-Content -Encoding ascii build/print-helper/SHA256SUMS.txt
      - name: Verify installed Windows application
        shell: pwsh
        run: |
          & build/print-helper/package/Install.ps1 -Quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $command = (Get-Item 'HKCU:\Software\Classes\mannaprint\shell\open\command').GetValue('')
          if (-not $command.Contains('MannaPrintHelper.exe')) { throw 'Protocol was not registered' }
          $exe = Join-Path $env:LOCALAPPDATA 'MannaPrintHelper/app/MannaPrintHelper.exe'
          $out = Join-Path $env:RUNNER_TEMP 'manna-self-test'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', $out) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Native application timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$out/result.txt")) { throw 'Native application smoke test failed' }
          Get-Content "$out/result.txt"
          # Exercise ShellExecute through the actual registered protocol, not
          # just the executable's CLI self-test. No network or real job is used.
          $key = 'HKCU:\Software\Classes\mannaprint\shell\open\command'
          $originalCommand = (Get-Item $key).GetValue('')
          try {
            $token = 'a' * 43
            $uris = @("mannaprint://open?job=$token", "mannaprint://OPEN/?job=$token", "mannaprint://open/?job=$token&url=https://example.invalid")
            for ($i=0; $i -lt $uris.Count; $i++) {
              $result = Join-Path $out "protocol-$i.txt"
              Set-Item $key -Value ('"{0}" --protocol-test "{1}" "%1"' -f $exe, $result)
              $start = New-Object System.Diagnostics.ProcessStartInfo
              $start.FileName = $uris[$i]
              $start.UseShellExecute = $true
              [System.Diagnostics.Process]::Start($start) | Out-Null
              for ($attempt=0; $attempt -lt 100 -and -not (Test-Path $result); $attempt++) { Start-Sleep -Milliseconds 200 }
              if (-not (Test-Path $result)) { throw "Protocol activation $i did not reach the helper" }
              $expected = if ($i -lt 2) { 'accepted' } else { 'rejected' }
              if ((Get-Content $result -Raw) -ne $expected) { throw "Protocol activation $i returned the wrong result" }
            }
          } finally { Set-Item $key -Value $originalCommand }

      - uses: actions/upload-artifact@v4
        with:
          name: MannaPrintHelper-Windows-x64
          path: |
            build/print-helper/MannaPrintHelper-Windows-x64.zip
            build/print-helper/SHA256SUMS.txt
            ${{ runner.temp }}/manna-self-test
      - name: Publish Windows package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view print-helper-v1.0.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release 1.0.1 already exists; bump version before publishing another package.'; exit 0 }
          gh release create print-helper-v1.0.1 build/print-helper/MannaPrintHelper-Windows-x64.zip build/print-helper/SHA256SUMS.txt --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title 'Manna Print Helper 1.0.1' --notes-file desktop/print-helper/windows/PETUNJUK.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
