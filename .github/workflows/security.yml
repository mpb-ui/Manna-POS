name: POS security and regression checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '25 23 * * 0'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manna_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: manna_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manna_test -d manna_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SECURITY_DATABASE_URL: postgresql://manna_test:test-only-password@127.0.0.1:5432/manna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node --test --test-concurrency=4
