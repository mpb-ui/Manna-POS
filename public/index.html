<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1769ea" />
  <title>Manna Print POS</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/sheet-calculator.css" />
  <link rel="stylesheet" href="/wholesale-prices.css" />
  <link rel="stylesheet" href="/navigation.css" />
  <link rel="stylesheet" href="/compact-pos.css" />
  <link rel="stylesheet" href="/order-summary.css" />
  <link rel="stylesheet" href="/product-configurator.css" />
  <link rel="stylesheet" href="/project-management.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card">
      <img src="/manna-print-logo.jpg" alt="Manna Print" />
      <h1>Masuk ke Manna POS</h1>
      <p>Masuk menggunakan akun operasional Anda.</p>
      <label>Username<input id="login-username" autocomplete="username" value="admin" required /></label>
      <label>PIN<input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" required /></label>
      <button class="primary full" type="submit">Masuk</button>
    </form>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <header class="top-navigation">
      <a class="top-brand" href="#pos" aria-label="Manna Print, buka halaman utama"><img class="top-brand-logo" src="/manna-print-logo-white.png" alt="Manna Print" /></a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">☰ <span>Menu</span></button>
      <nav id="primary-navigation" aria-label="Menu utama">
        <button type="button" class="nav-item active" data-view="pos" aria-current="page"><b>POS</b></button>
        <button type="button" class="nav-item" data-view="order-history"><b>Status Order</b></button>
        <button type="button" class="nav-item" data-view="projects"><b>Project Management</b><em id="active-count">0</em></button>
        <button type="button" class="nav-item" data-view="stock"><b>Stok Bahan</b></button>
        <button type="button" class="nav-item" data-view="reports"><b>Laporan</b></button>
        <button type="button" class="nav-item hidden" data-view="employees"><b>Karyawan</b></button>
        <button type="button" class="nav-item" data-view="master"><b>Master Data</b></button>
      </nav>
      <details class="account-menu" id="account-menu">
        <summary aria-label="Menu akun"><span class="account-avatar" aria-hidden="true">●</span><strong id="current-user-name">—</strong><span class="account-chevron ui-chevron" aria-hidden="true"></span></summary>
        <div class="account-popover"><small id="current-user-role">—</small><span id="today"></span><span><i class="online-dot"></i>Sistem aktif</span><button id="refresh-btn" type="button">↻ Muat ulang data</button><button id="logout-btn" type="button">Keluar</button></div>
      </details>
    </header>
    <main class="main-content">
      <h1 id="page-title" class="page-heading visually-hidden">Point of Sale</h1>
      <div id="view-root"></div>
    </main>
  </div>

  <button id="briefing-fab" class="briefing-fab hidden" type="button" aria-label="Buka Briefing Hari Ini" title="Briefing Hari Ini" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="8" y="2" width="8" height="5" rx="1.5"/><path d="m8 12 1 1 2-2m-3 6 1 1 2-2m3-4h3m-3 5h3"/></svg>
  </button>

  <dialog id="order-dialog" class="order-dialog"><div id="order-detail"></div></dialog>
  <section id="print-document" class="print-document"></section>
  <script type="module" src="/app.js"></script>
</body>
</html>
